name: Build and Deploy Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Build dashboard
        run: pnpm --filter @classworks/dashboard run build

      - name: Upload dashboard dist
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          if-no-files-found: error
